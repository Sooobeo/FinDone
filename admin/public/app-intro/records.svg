<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">FinDone 기록 화면</title><desc id="desc">정답률, 오답, 북마크와 학습 기록을 보여주는 앱 화면</desc>
  <rect width="360" height="720" rx="42" fill="#123f3c"/><rect x="10" y="10" width="340" height="700" rx="34" fill="#f5f8f6"/><rect x="135" y="18" width="90" height="7" rx="4" fill="#c8d4d0"/>
  <text x="28" y="61" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2d7871" letter-spacing="1.5">LOCAL RECORDS</text><text x="28" y="94" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#162522">학습 기록</text><text x="28" y="116" font-family="Arial,sans-serif" font-size="11" fill="#697874">오답과 북마크를 다음 학습으로 연결합니다.</text>
  <g font-family="Arial,sans-serif"><rect x="24" y="138" width="96" height="74" rx="16" fill="white" stroke="#dfe5e2"/><rect x="132" y="138" width="96" height="74" rx="16" fill="white" stroke="#dfe5e2"/><rect x="240" y="138" width="96" height="74" rx="16" fill="white" stroke="#dfe5e2"/><text x="42" y="163" font-size="10" fill="#697874">풀이</text><text x="42" y="193" font-size="22" font-weight="800" fill="#18524e">—</text><text x="150" y="163" font-size="10" fill="#697874">정답률</text><text x="150" y="193" font-size="22" font-weight="800" fill="#18524e">—%</text><text x="258" y="163" font-size="10" fill="#697874">오답</text><text x="258" y="193" font-size="22" font-weight="800" fill="#b44f45">—</text></g>
  <g font-family="Arial,sans-serif" font-size="10"><rect x="24" y="232" width="60" height="30" rx="15" fill="#18524e"/><text x="54" y="251" text-anchor="middle" fill="white">오답</text><rect x="92" y="232" width="68" height="30" rx="15" fill="white" stroke="#ccd5d1"/><text x="126" y="251" text-anchor="middle" fill="#697874">북마크</text><rect x="168" y="232" width="78" height="30" rx="15" fill="white" stroke="#ccd5d1"/><text x="207" y="251" text-anchor="middle" fill="#697874">백업·정보</text></g>
  <rect x="24" y="280" width="312" height="76" rx="17" fill="white" stroke="#dfe5e2"/><text x="40" y="306" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#697874">조회 범위</text><rect x="40" y="318" width="50" height="24" rx="12" fill="#18524e"/><text x="65" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">전체</text><rect x="98" y="318" width="62" height="24" rx="12" fill="#edf1ef"/><text x="129" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#697874">분야 선택</text>
  <text x="24" y="393" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#162522">단원별 최근 오답</text><text x="316" y="393" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2d7871">이 범위 풀기</text>
  <rect x="24" y="408" width="312" height="120" rx="17" fill="white" stroke="#dfe5e2"/><rect x="40" y="425" width="44" height="20" rx="10" fill="#fff0ee"/><text x="62" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#b44f45">오답</text><text x="96" y="439" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#162522">학습요소</text><text x="40" y="472" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#162522">최근 틀린 문제의 핵심 질문</text><text x="40" y="495" font-family="Arial,sans-serif" font-size="10" fill="#b44f45">내 답과 정답을 비교합니다.</text><rect x="40" y="504" width="100" height="2" fill="#f1d8d4"/>
  <rect x="24" y="542" width="312" height="56" rx="17" fill="#edf7f5"/><circle cx="52" cy="570" r="14" fill="#dbefeb"/><path d="M47 570l4 4 7-9" fill="none" stroke="#18524e" stroke-width="2"/><text x="78" y="566" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#18524e">복습 기록을 안전하게 보관</text><text x="78" y="584" font-family="Arial,sans-serif" font-size="9" fill="#697874">백업·복원과 직접 초기화</text>
  <rect x="10" y="634" width="340" height="76" fill="white"/><g font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="55" y="675" fill="#97a39f">●</text><text x="55" y="694" fill="#697874">오늘</text><text x="138" y="675" fill="#97a39f">▤</text><text x="138" y="694" fill="#697874">학습</text><text x="222" y="675" fill="#97a39f">◇</text><text x="222" y="694" fill="#697874">퀴즈</text><text x="305" y="675" fill="#18524e" font-weight="700">▣</text><text x="305" y="694" fill="#18524e" font-weight="700">기록</text></g>
</svg>
