<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">FinDone 학습 화면</title><desc id="desc">검색과 분야 필터, 학습요소 카드를 보여주는 앱 화면</desc>
  <rect width="360" height="720" rx="42" fill="#123f3c"/><rect x="10" y="10" width="340" height="700" rx="34" fill="#f5f8f6"/><rect x="135" y="18" width="90" height="7" rx="4" fill="#c8d4d0"/>
  <text x="28" y="61" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2d7871" letter-spacing="1.5">KNOWLEDGE BASE</text><text x="28" y="94" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#162522">학습요소</text><text x="28" y="116" font-family="Arial,sans-serif" font-size="11" fill="#697874">개념·수식·근거를 검색하세요.</text>
  <rect x="24" y="138" width="312" height="48" rx="14" fill="white" stroke="#ccd5d1"/><circle cx="47" cy="162" r="8" fill="none" stroke="#697874" stroke-width="2"/><path d="M53 168l6 6" stroke="#697874" stroke-width="2"/><text x="72" y="167" font-family="Arial,sans-serif" font-size="11" fill="#97a39f">요소 ID, 개념명, 수식 검색</text>
  <g font-family="Arial,sans-serif" font-size="10"><rect x="24" y="200" width="50" height="28" rx="14" fill="#18524e"/><text x="49" y="218" fill="white" text-anchor="middle">전체</text><rect x="82" y="200" width="56" height="28" rx="14" fill="white" stroke="#ccd5d1"/><text x="110" y="218" fill="#697874" text-anchor="middle">회계</text><rect x="146" y="200" width="64" height="28" rx="14" fill="white" stroke="#ccd5d1"/><text x="178" y="218" fill="#697874" text-anchor="middle">기업금융</text><rect x="218" y="200" width="58" height="28" rx="14" fill="white" stroke="#ccd5d1"/><text x="247" y="218" fill="#697874" text-anchor="middle">채권</text></g>
  <text x="24" y="263" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#162522">검색 결과</text><text x="316" y="263" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#697874">학습요소</text>
  <g font-family="Arial,sans-serif"><rect x="24" y="278" width="312" height="104" rx="17" fill="white" stroke="#dfe5e2"/><rect x="40" y="295" width="42" height="20" rx="10" fill="#dbefeb"/><text x="61" y="309" text-anchor="middle" font-size="9" font-weight="700" fill="#18524e">개념</text><text x="93" y="309" font-size="9" fill="#697874">FIELD-01</text><text x="40" y="339" font-size="14" font-weight="800" fill="#162522">학습요소 제목</text><text x="40" y="361" font-size="10" fill="#697874">핵심 관계와 설명이 카드에 요약됩니다.</text><text x="314" y="338" font-size="20" fill="#97a39f">›</text>
  <rect x="24" y="394" width="312" height="104" rx="17" fill="white" stroke="#dfe5e2"/><rect x="40" y="411" width="42" height="20" rx="10" fill="#fbf3e2"/><text x="61" y="425" text-anchor="middle" font-size="9" font-weight="700" fill="#8b621f">수식</text><text x="93" y="425" font-size="9" fill="#697874">FIELD-02</text><text x="40" y="455" font-size="14" font-weight="800" fill="#162522">공식과 적용 가정</text><text x="40" y="477" font-size="10" fill="#697874">변수·범위·체크리스트를 연결합니다.</text><text x="314" y="454" font-size="20" fill="#97a39f">›</text>
  <rect x="24" y="510" width="312" height="88" rx="17" fill="white" stroke="#dfe5e2"/><rect x="40" y="527" width="42" height="20" rx="10" fill="#eaf2f8"/><text x="61" y="541" text-anchor="middle" font-size="9" font-weight="700" fill="#527c9d">근거</text><text x="40" y="572" font-size="14" font-weight="800" fill="#162522">출처와 학습 체크리스트</text><text x="314" y="564" font-size="20" fill="#97a39f">›</text></g>
  <rect x="10" y="634" width="340" height="76" fill="white"/><g font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="55" y="675" fill="#97a39f">●</text><text x="55" y="694" fill="#697874">오늘</text><text x="138" y="675" fill="#18524e" font-weight="700">▤</text><text x="138" y="694" fill="#18524e" font-weight="700">학습</text><text x="222" y="675" fill="#97a39f">◇</text><text x="222" y="694" fill="#697874">퀴즈</text><text x="305" y="675" fill="#97a39f">▣</text><text x="305" y="694" fill="#697874">기록</text></g>
</svg>
