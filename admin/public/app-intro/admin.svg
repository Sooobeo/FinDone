<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
  <title id="title">FinDone 로컬 모델에서 Android 앱으로 이어지는 콘텐츠 업데이트 흐름</title>
  <desc id="desc">기준 데이터와 원본 준비, 로컬 랭커 실험, 앱 DB 후보 생성, 사람 검토, stable 공개와 앱 무결성 검증 순서를 보여준다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#deece8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#123f3c" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="3" fill="url(#canvas)"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="42" y="47" font-size="10" font-weight="800" letter-spacing="1.7" fill="#2d7871">CONTENT DELIVERY</text>
    <text x="42" y="78" font-size="24" font-weight="850" fill="#162522">모델링에서 앱까지</text>
    <text x="42" y="101" font-size="10" fill="#60736d">원본 → 로컬 모델 → 앱 DB 후보 → 사람 검토 → stable 릴리스</text>

    <g filter="url(#shadow)">
      <rect x="42" y="128" width="516" height="292" rx="3" fill="#fff" stroke="#cad6d2"/>
      <rect x="42" y="128" width="112" height="292" rx="3" fill="#123f3c"/>
      <rect x="55" y="145" width="26" height="26" rx="3" fill="#f7fbfa"/>
      <text x="68" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#123f3c">F</text>
      <text x="89" y="158" font-size="11" font-weight="800" fill="#fff">FinDone</text>
      <text x="89" y="171" font-size="5.5" font-weight="700" letter-spacing=".8" fill="#9fc0ba">CONTENT ADMIN</text>

      <g font-size="8" fill="#a9c8c2">
        <text x="58" y="213">대시보드</text>
        <text x="58" y="247">개념 DB</text>
        <text x="58" y="279">원본 자료</text>
        <rect x="54" y="290" width="87" height="30" rx="3" fill="#ffffff" fill-opacity=".1"/>
        <text x="64" y="309" font-weight="800" fill="#fff">로컬 모델</text>
        <text x="58" y="339">앱 DB 최종 검토</text>
        <text x="58" y="369">릴리스 이력</text>
      </g>

      <rect x="154" y="128" width="404" height="42" fill="#fbfcfc"/>
      <line x1="154" y1="170" x2="558" y2="170" stroke="#dfe5e2"/>
      <text x="176" y="154" font-size="10" font-weight="800" fill="#263c36">로컬 모델 현황</text>
      <rect x="482" y="140" width="56" height="18" rx="3" fill="#e7f4ee"/>
      <circle cx="493" cy="149" r="3" fill="#338268"/>
      <text x="501" y="152" font-size="6.5" font-weight="700" fill="#276d59">Owner</text>

      <text x="176" y="197" font-size="7" font-weight="800" fill="#73817d">모델링 과정</text>
      <g>
        <rect x="176" y="208" width="104" height="70" rx="3" fill="#f7faf9" stroke="#dfe5e2"/>
        <rect x="188" y="221" width="25" height="25" rx="3" fill="#eaf2f8"/>
        <path d="M195 228h11M195 233h11M195 238h8" stroke="#527c9d" stroke-width="1.4" stroke-linecap="round"/>
        <text x="188" y="260" font-size="8" font-weight="800" fill="#263c36">기준 데이터</text>
        <text x="188" y="271" font-size="6" fill="#71807b">기존 DB와 원본 준비</text>

        <rect x="290" y="208" width="104" height="70" rx="3" fill="#f7faf9" stroke="#dfe5e2"/>
        <rect x="302" y="221" width="25" height="25" rx="3" fill="#edf7f5"/>
        <path d="M309 227h11v13h-11zM312 230h5M312 234h5M312 238h4" fill="none" stroke="#2d7871" stroke-width="1.2" stroke-linecap="round"/>
        <text x="302" y="260" font-size="8" font-weight="800" fill="#263c36">랭커 실험</text>
        <text x="302" y="271" font-size="6" fill="#71807b">train·validation·test</text>

        <rect x="404" y="208" width="104" height="70" rx="3" fill="#f7faf9" stroke="#dfe5e2"/>
        <rect x="416" y="221" width="25" height="25" rx="3" fill="#fff0eb"/>
        <path d="M423 228l11 11M434 228l-11 11" stroke="#d46e55" stroke-width="1.4" stroke-linecap="round"/>
        <text x="416" y="260" font-size="8" font-weight="800" fill="#263c36">앱 DB 후보</text>
        <text x="416" y="271" font-size="6" fill="#71807b">결정론 SQLite 빌드</text>
      </g>

      <path d="M225 293v15M342 293v15M456 293v15M225 308h231" fill="none" stroke="#a9bbb5" stroke-width="1.2"/>
      <path d="M342 305l4 5-4 5" fill="none" stroke="#2d7871" stroke-width="1.5"/>

      <text x="176" y="330" font-size="7" font-weight="800" fill="#73817d">검증과 릴리스</text>
      <g>
        <rect x="176" y="341" width="104" height="55" rx="3" fill="#edf7f5" stroke="#cfe5df"/>
        <circle cx="192" cy="357" r="7" fill="#338268"/>
        <path d="M188 357l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.3"/>
        <text x="205" y="359" font-size="8" font-weight="800" fill="#263c36">자동 게이트</text>
        <text x="188" y="382" font-size="6" fill="#60736d">중복·노출·무결성 검사</text>

        <path d="M286 368h13" stroke="#7fa79f" stroke-width="1.5"/>
        <path d="M296 364l4 4-4 4" fill="none" stroke="#7fa79f" stroke-width="1.5"/>

        <rect x="304" y="341" width="104" height="55" rx="3" fill="#fff6df" stroke="#ead9ad"/>
        <circle cx="320" cy="357" r="7" fill="#ad741c"/>
        <path d="M316 357l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.3"/>
        <text x="333" y="359" font-size="8" font-weight="800" fill="#263c36">사람 검토</text>
        <text x="316" y="382" font-size="6" fill="#60736d">문항·정답·근거 확인</text>

        <path d="M414 368h13" stroke="#7fa79f" stroke-width="1.5"/>
        <path d="M424 364l4 4-4 4" fill="none" stroke="#7fa79f" stroke-width="1.5"/>

        <rect x="432" y="341" width="104" height="55" rx="3" fill="#18524e"/>
        <circle cx="448" cy="357" r="7" fill="#fff" fill-opacity=".18"/>
        <path d="M444 357h8M448 353v8" stroke="#fff" stroke-width="1.3"/>
        <text x="461" y="359" font-size="8" font-weight="800" fill="#fff">stable 공개</text>
        <text x="444" y="382" font-size="6" fill="#c7ddd8">stable 릴리스 공개</text>
      </g>
    </g>

    <path d="M300 432v30" stroke="#2d7871" stroke-width="2"/>
    <path d="M294 456l6 7 6-7" fill="none" stroke="#2d7871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="116" y="475" width="368" height="72" rx="3" fill="#fff" stroke="#cad6d2"/>
      <rect x="132" y="491" width="42" height="40" rx="3" fill="#edf7f5"/>
      <path d="M142 502h22v17h-22zM147 497h12v5" fill="none" stroke="#2d7871" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="188" y="502" font-size="8" font-weight="800" letter-spacing=".8" fill="#2d7871">STABLE CHANNEL</text>
      <text x="188" y="520" font-size="12" font-weight="850" fill="#162522">manifest + SQLite DB</text>
      <text x="188" y="535" font-size="7" fill="#60736d">공개 HTTPS endpoint · 10분 서명 다운로드 URL</text>
      <rect x="398" y="493" width="66" height="22" rx="3" fill="#e7f4ee"/>
      <text x="431" y="507" text-anchor="middle" font-size="7" font-weight="800" fill="#338268">PUBLISHED</text>
      <text x="431" y="530" text-anchor="middle" font-size="6" fill="#75847f">versioned</text>
    </g>

    <path d="M300 559v29" stroke="#2d7871" stroke-width="2"/>
    <path d="M294 582l6 7 6-7" fill="none" stroke="#2d7871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="116" y="601" width="368" height="67" rx="3" fill="#123f3c"/>
      <rect x="132" y="612" width="28" height="44" rx="5" fill="#f7fbfa" stroke="#91ada7"/>
      <rect x="143" y="616" width="7" height="2" rx="1" fill="#b4c5c1"/>
      <path d="M139 634l5 5 10-12" fill="none" stroke="#2d7871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="176" y="624" font-size="8" font-weight="800" letter-spacing=".8" fill="#a9c9c3">ANDROID APP</text>
      <text x="176" y="643" font-size="12" font-weight="850" fill="#fff">버전·크기·SHA-256 검증 후 설치</text>
      <text x="176" y="658" font-size="7" fill="#b8d0cb">실패하면 마지막 정상 콘텐츠로 계속 실행</text>
    </g>
  </g>
</svg>
