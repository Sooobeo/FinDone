<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">FinDone 퀴즈 만들기 화면</title>
  <desc id="desc">실제 앱과 같은 일곱 가지 학습 모드와 각 모드의 설명을 보여주는 화면</desc>
  <rect width="360" height="720" rx="42" fill="#123f3c"/>
  <rect x="10" y="10" width="340" height="700" rx="34" fill="#f5f8f6"/>
  <rect x="135" y="18" width="90" height="7" rx="4" fill="#c8d4d0"/>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="28" y="55" font-size="9" font-weight="700" fill="#2d7871" letter-spacing="1.1">DETERMINISTIC PRACTICE</text>
    <text x="28" y="84" font-size="25" font-weight="800" fill="#162522">퀴즈 만들기</text>
    <text x="28" y="105" font-size="9" fill="#697874">같은 콘텐츠 버전과 seed는 같은 문제를 만듭니다.</text>
    <text x="24" y="135" font-size="13" font-weight="800" fill="#162522">학습 모드</text>

    <rect x="22" y="148" width="316" height="449" rx="17" fill="#fff" stroke="#d3dcd8"/>
    <path d="M22 165a17 17 0 0 1 17-17h282a17 17 0 0 1 17 17v25H22z" fill="#e9efec"/>
    <text x="37" y="174" font-size="10" font-weight="800" fill="#314943">7개 모드</text>
    <text x="323" y="174" text-anchor="end" font-size="8" fill="#697874">위아래로 스크롤해 선택</text>
    <line x1="22" y1="190" x2="338" y2="190" stroke="#d3dcd8"/>

    <g>
      <rect x="31" y="198" width="298" height="49" rx="12" fill="#dceee9" stroke="#2d7871" stroke-width="1.5"/>
      <circle cx="53" cy="222.5" r="13" fill="#c4e3dc"/>
      <path d="M47 217h12M47 221h12M47 225h8" stroke="#18524e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="74" y="217" font-size="10.5" font-weight="800" fill="#162522">분야별 학습</text>
      <text x="74" y="233" font-size="7.7" fill="#566a64">선택한 분야의 요소를 고르게 섞습니다.</text>
      <circle cx="312" cy="222" r="8" fill="#2d7871"/>
      <path d="M308.5 222l2.4 2.4 4.7-5.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <rect x="31" y="254" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="278.5" r="13" fill="#edf2f0"/>
      <path d="M58 273a7 7 0 1 0 1 8M58 273v5h-5" fill="none" stroke="#60736d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="273" font-size="10.5" font-weight="800" fill="#162522">약점 집중</text>
      <text x="74" y="289" font-size="7.7" fill="#566a64">최근 오답이 남은 요소부터 다시 풉니다.</text>
    </g>

    <g>
      <rect x="31" y="310" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="334.5" r="13" fill="#edf2f0"/>
      <path d="M46 337l5-8 3 5 6-7" fill="none" stroke="#60736d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="329" font-size="10.5" font-weight="800" fill="#162522">금융권 스프린트</text>
      <text x="74" y="345" font-size="7.7" fill="#566a64">30·60·90초 개념·계산 문제를 섞습니다.</text>
    </g>

    <g>
      <rect x="31" y="366" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="390.5" r="13" fill="#edf2f0"/>
      <path d="M48 394c-4-5 0-11 5-10 5-1 9 5 5 10M50 397h6" fill="none" stroke="#60736d" stroke-width="1.5" stroke-linecap="round"/>
      <text x="74" y="385" font-size="10.5" font-weight="800" fill="#162522">개념 랜덤</text>
      <text x="74" y="401" font-size="7.7" fill="#566a64">핵심 관계와 흔한 혼동을 객관식으로 점검합니다.</text>
    </g>

    <g>
      <rect x="31" y="422" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="446.5" r="13" fill="#edf2f0"/>
      <rect x="49" y="438" width="8" height="12" rx="4" fill="none" stroke="#60736d" stroke-width="1.5"/>
      <path d="M46 446a7 7 0 0 0 14 0M53 453v4" fill="none" stroke="#60736d" stroke-width="1.5" stroke-linecap="round"/>
      <text x="74" y="441" font-size="10.5" font-weight="800" fill="#162522">구술 연습</text>
      <text x="74" y="457" font-size="7.7" fill="#566a64">30~60초로 답한 뒤 핵심 관계와 스스로 비교합니다.</text>
    </g>

    <g>
      <rect x="31" y="478" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="502.5" r="13" fill="#edf2f0"/>
      <path d="M47 495h12v15H47zM50 499h6M50 503h6M50 507h4" fill="none" stroke="#60736d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="497" font-size="10.5" font-weight="800" fill="#162522">통합 케이스</text>
      <text x="74" y="513" font-size="7.7" fill="#566a64">리서치·기업가치·딜 요소를 연결해 연습합니다.</text>
    </g>

    <g>
      <rect x="31" y="534" width="298" height="49" rx="12" fill="#fff" stroke="#d3dcd8"/>
      <circle cx="53" cy="558.5" r="13" fill="#edf2f0"/>
      <path d="M48 550h10v17l-5-3-5 3z" fill="none" stroke="#60736d" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="74" y="553" font-size="10.5" font-weight="800" fill="#162522">북마크 복습</text>
      <text x="74" y="569" font-size="7.7" fill="#566a64">저장한 문제 snapshot을 같은 seed로 재생합니다.</text>
    </g>

    <rect x="10" y="634" width="340" height="76" fill="#fff"/>
    <line x1="10" y1="634" x2="350" y2="634" stroke="#e1e7e4"/>
    <g font-size="10" text-anchor="middle">
      <circle cx="55" cy="671" r="3" fill="#97a39f"/><text x="55" y="695" fill="#697874">오늘</text>
      <path d="M132 666h12v10h-12z" fill="none" stroke="#97a39f"/><text x="138" y="695" fill="#697874">학습</text>
      <path d="M222 665l7 7-7 7-7-7z" fill="none" stroke="#18524e" stroke-width="1.5"/><text x="222" y="695" fill="#18524e" font-weight="800">퀴즈</text>
      <path d="M299 665h12v13h-12z" fill="none" stroke="#97a39f"/><text x="305" y="695" fill="#697874">기록</text>
    </g>
  </g>
</svg>
