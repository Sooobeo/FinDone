<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">FinDone 퀴즈 화면</title><desc id="desc">학습 모드, 분야, 난이도와 문제 수를 선택하는 앱 화면</desc>
  <rect width="360" height="720" rx="42" fill="#123f3c"/><rect x="10" y="10" width="340" height="700" rx="34" fill="#f5f8f6"/><rect x="135" y="18" width="90" height="7" rx="4" fill="#c8d4d0"/>
  <text x="28" y="61" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2d7871" letter-spacing="1.3">DETERMINISTIC PRACTICE</text><text x="28" y="94" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#162522">퀴즈 만들기</text><text x="28" y="116" font-family="Arial,sans-serif" font-size="11" fill="#697874">필요한 조건으로 연습 세션을 구성합니다.</text>
  <text x="24" y="153" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#162522">학습 모드</text><rect x="24" y="167" width="312" height="98" rx="17" fill="white" stroke="#2d7871" stroke-width="2"/><circle cx="55" cy="207" r="18" fill="#dbefeb"/><path d="M47 207h16M55 199v16" stroke="#18524e" stroke-width="2"/><text x="85" y="201" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#162522">분야별 학습</text><text x="85" y="224" font-family="Arial,sans-serif" font-size="10" fill="#697874">선택한 분야의 요소를 고르게 섞습니다.</text><circle cx="312" cy="207" r="9" fill="#2d7871"/><path d="M308 207l3 3 6-7" fill="none" stroke="white" stroke-width="2"/>
  <text x="24" y="300" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#162522">분야</text><g font-family="Arial,sans-serif" font-size="10"><rect x="24" y="314" width="58" height="28" rx="14" fill="#18524e"/><text x="53" y="332" fill="white" text-anchor="middle">전체</text><rect x="90" y="314" width="60" height="28" rx="14" fill="white" stroke="#ccd5d1"/><text x="120" y="332" fill="#697874" text-anchor="middle">분야 1</text><rect x="158" y="314" width="60" height="28" rx="14" fill="white" stroke="#ccd5d1"/><text x="188" y="332" fill="#697874" text-anchor="middle">분야 2</text></g>
  <text x="24" y="379" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#162522">난이도</text><g font-family="Arial,sans-serif" font-size="10"><rect x="24" y="393" width="96" height="36" rx="18" fill="#18524e"/><text x="72" y="415" fill="white" text-anchor="middle">1 · 30초</text><rect x="132" y="393" width="96" height="36" rx="18" fill="white" stroke="#ccd5d1"/><text x="180" y="415" fill="#697874" text-anchor="middle">2 · 60초</text><rect x="240" y="393" width="96" height="36" rx="18" fill="white" stroke="#ccd5d1"/><text x="288" y="415" fill="#697874" text-anchor="middle">3 · 90초</text></g>
  <text x="24" y="466" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#162522">문제 수</text><g font-family="Arial,sans-serif" font-size="10"><rect x="24" y="480" width="74" height="32" rx="16" fill="#18524e"/><text x="61" y="500" fill="white" text-anchor="middle">5문제</text><rect x="106" y="480" width="74" height="32" rx="16" fill="white" stroke="#ccd5d1"/><text x="143" y="500" fill="#697874" text-anchor="middle">10문제</text><rect x="188" y="480" width="74" height="32" rx="16" fill="white" stroke="#ccd5d1"/><text x="225" y="500" fill="#697874" text-anchor="middle">20문제</text></g>
  <rect x="24" y="541" width="312" height="48" rx="16" fill="#18524e"/><text x="180" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="white">분야별 학습 시작</text>
  <rect x="10" y="634" width="340" height="76" fill="white"/><g font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="55" y="675" fill="#97a39f">●</text><text x="55" y="694" fill="#697874">오늘</text><text x="138" y="675" fill="#97a39f">▤</text><text x="138" y="694" fill="#697874">학습</text><text x="222" y="675" fill="#18524e" font-weight="700">◇</text><text x="222" y="694" fill="#18524e" font-weight="700">퀴즈</text><text x="305" y="675" fill="#97a39f">▣</text><text x="305" y="694" fill="#697874">기록</text></g>
