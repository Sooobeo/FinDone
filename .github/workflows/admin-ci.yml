name: Admin CI

on:
  pull_request:
    paths:
      - "admin/**"
      - "supabase/**"
      - "tools/admin_*.py"
      - "tools/test_admin_*.py"
      - "tools/*glossary*.py"
      - "content/glossary/**"
      - "tools/requirements-source-worker.txt"
      - "tools/validate_supabase_sql.py"
      - "tools/repo_preflight.py"
      - "tools/test_repo_preflight.py"
      - "scripts/refresh_admin_content.ps1"
      - "AGENTS.md"
      - ".githooks/pre-commit"
      - ".github/workflows/admin-ci.yml"
      - ".github/workflows/repository-preflight.yml"
      - ".github/workflows/admin-source-worker.yml"
      - ".github/workflows/admin-glossary-worker.yml"
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "supabase/**"
      - "tools/admin_*.py"
      - "tools/test_admin_*.py"
      - "tools/*glossary*.py"
      - "content/glossary/**"
      - "tools/requirements-source-worker.txt"
      - "tools/validate_supabase_sql.py"
      - "tools/repo_preflight.py"
      - "tools/test_repo_preflight.py"
      - "scripts/refresh_admin_content.ps1"
      - "AGENTS.md"
      - ".githooks/pre-commit"
      - ".github/workflows/admin-ci.yml"
      - ".github/workflows/repository-preflight.yml"
      - ".github/workflows/admin-source-worker.yml"
      - ".github/workflows/admin-glossary-worker.yml"

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FINDONE_ADMIN_DEMO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SQL parser
        run: python -m pip install pglast==7.10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Run Admin CI-parity preflight
        run: >-
          python tools/repo_preflight.py verify
          --scope admin
          --changes head
          --ci
