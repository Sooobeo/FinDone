name: Admin CI

on:
  pull_request:
    paths:
      - "admin/**"
      - "supabase/**"
      - "tools/admin_*.py"
      - "tools/test_admin_*.py"
      - "tools/validate_supabase_sql.py"
      - "scripts/refresh_admin_content.ps1"
      - ".github/workflows/admin-ci.yml"
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "supabase/**"
      - "tools/admin_*.py"
      - "tools/test_admin_*.py"
      - "tools/validate_supabase_sql.py"
      - "scripts/refresh_admin_content.ps1"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FINDONE_ADMIN_DEMO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SQL parser
        run: python -m pip install pglast==7.10

      - name: Verify packaged-content export and Supabase SQL
        run: |
          python -m unittest discover -s tools -p "test_admin*.py" -v
          python tools/validate_supabase_sql.py
          python tools/admin_export_content.py \
            --frontend-json admin/data/content-elements.generated.json \
            --frontend-sources-json admin/data/sources.generated.json
          git diff --exit-code -- admin/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Test and build Admin
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build
