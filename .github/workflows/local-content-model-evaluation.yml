name: Local Content Model Evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "content/**"
      - "finance_interview_app_final_spec.md"
      - "tools/build_content_db.py"
      - "tools/local_content_model.py"
      - "tools/compile_app_content.py"
      - "tools/test_local_content_model.py"
      - "tools/train_concept_question_model.py"
      - "tools/review_concept_question_model.py"
      - "tools/test_train_concept_question_model.py"
      - "tools/requirements-concept-model-core.txt"
      - "tools/repo_preflight.py"
      - "tools/test_repo_preflight.py"
      - "content/model/concept-model-config.json"
      - "content/model/concept-question-bank.generated.json"
      - "admin/data/concept-model-experiments.generated.json"
      - "AGENTS.md"
      - ".githooks/pre-commit"
      - ".github/workflows/repository-preflight.yml"
      - ".github/workflows/local-content-model-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate-offline-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install offline concept-model core
        run: python -m pip install --disable-pip-version-check -r tools/requirements-concept-model-core.txt

      - name: Run local model CI-parity preflight
        run: >-
          python tools/repo_preflight.py verify
          --scope model
          --changes head
          --ci

      - name: Install tree ranker for full automated review
        run: python -m pip install --disable-pip-version-check xgboost==3.4.0

      - name: Run incremental concept-question automated review
        run: >-
          python tools/train_concept_question_model.py
          --ranker all
          --quiet
          --write-question-bank
          --write-admin-report
          --write-markdown-report

      - name: Upload concept-question review packet
        uses: actions/upload-artifact@v4
        with:
          name: concept-question-review
          path: |
            build/concept-model/latest-report.json
            content/model/concept-question-bank.generated.json
          if-no-files-found: error

      - name: Upload measured model report
        uses: actions/upload-artifact@v4
        with:
          name: local-content-model-report
          path: build/local-content-model-report.json
          if-no-files-found: error
