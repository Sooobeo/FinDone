name: Local Content Compiler Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: findone-admin-content-generation-worker
  cancel-in-progress: false

jobs:
  generate-review-candidates:
    if: github.event_name == 'workflow_dispatch' || vars.ADMIN_CONTENT_GENERATION_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check required worker configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "SUPABASE_SECRET_KEY secret is missing"; exit 1; }

      - name: Map, validate, and safely repair review candidates locally
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: >-
          python tools/admin_content_generation_worker.py
          --worker-id "local-compiler:${{ github.run_id }}:${{ github.run_attempt }}"
          --model-config content/model/local-content-model.json
          --max-batches 1
          --max-elements 135
          --auto-enqueue-sources 50
