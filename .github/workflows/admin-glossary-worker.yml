name: Admin Glossary Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: findone-admin-glossary-worker
  cancel-in-progress: false

jobs:
  compile-publish-glossary:
    if: github.event_name == 'workflow_dispatch' || vars.ADMIN_GLOSSARY_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Inspect repository guardrails
        run: >-
          python tools/repo_preflight.py inspect
          --scope admin
          --changes head
          --ci

      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "SUPABASE_SECRET_KEY secret is missing"; exit 1; }

      - name: Compile and publish queued static glossary packs
        id: glossary
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          result="$(python tools/admin_glossary_worker.py \
            --worker-id "github:${{ github.run_id }}:${{ github.run_attempt }}" \
            --max-jobs 10)"
          printf '%s\n' "$result"
          if [[ "$result" == *'"status": "processed"'* ]]; then
            echo "processed=true" >> "$GITHUB_OUTPUT"
          else
            echo "processed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify newly published public stable glossary
        if: steps.glossary.outputs.processed == 'true'
        env:
          GLOSSARY_RELEASE_ENDPOINT: ${{ vars.GLOSSARY_RELEASE_ENDPOINT }}
        run: |
          test -n "$GLOSSARY_RELEASE_ENDPOINT" || { echo "GLOSSARY_RELEASE_ENDPOINT variable is missing"; exit 1; }
          python tools/verify_glossary_release.py "$GLOSSARY_RELEASE_ENDPOINT" --timeout 180
