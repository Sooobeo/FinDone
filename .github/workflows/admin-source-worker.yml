name: Admin Source Ingestion Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: findone-admin-source-worker
  cancel-in-progress: false

jobs:
  ingest-sources:
    if: github.event_name == 'workflow_dispatch' || vars.ADMIN_SOURCE_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-source-worker.txt

      - name: Install local PDF and OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor
          python -m pip install --requirement tools/requirements-source-worker.txt

      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "SUPABASE_SECRET_KEY secret is missing"; exit 1; }

      - name: Fetch, extract and classify queued sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADMIN_SOURCE_WORKER_MAX_MIB: ${{ vars.ADMIN_SOURCE_WORKER_MAX_MIB || '1024' }}
        run: >-
          python tools/admin_source_ingestion_worker.py
          --worker-id "github:${{ github.run_id }}:${{ github.run_attempt }}"
          --max-jobs 4
          --auto-queue-catalog 4
